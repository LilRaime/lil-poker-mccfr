[package]
name = "lil-poker-mccfr"
version = "0.1.0"
edition = "2021"
description = "Parallel MCCFR (CFR+) Poker Solver"
license = "GPL-3.0-or-later"

[[bin]]
name = "train"
path = "src/main.rs"

[[bin]]
name = "play_live"
path = "src/bin/play_live.rs"

[dependencies]
rayon            = "1.10"
dashmap          = "6.1"
rand             = { version = "0.8", features = ["small_rng"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
clap             = { version = "4", features = ["derive"] }
tokio            = { version = "1", features = ["full"] }
reqwest          = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
tokio-tungstenite = { version = "0.23", default-features = false, features = ["handshake", "connect", "rustls-tls-webpki-roots"] }
futures-util     = "0.3"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
