[package]
name = "lil-poker-mccfr"
version = "0.1.0"
edition = "2024"
description = "Parallel MCCFR (CFR+) Poker Solver"
license = "GPL-3.0-or-later"

[[bin]]
name = "train"
path = "src/main.rs"

[[bin]]
name = "play_live"
path = "src/bin/play_live.rs"

[dependencies]
bincode           = "1.3"
clap              = { version = "4", features = ["derive"] }
dashmap           = "6.1"
futures-util      = "0.3"
rand              = "0.10"
rayon             = "1.10"
reqwest           = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tokio             = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.23", default-features = false, features = ["handshake", "connect", "rustls-tls-webpki-roots"] }

[lints.clippy]
redundant_closure_for_method_calls = "warn"
trivially_copy_pass_by_ref         = "warn"
items_after_statements             = "warn"
uninlined_format_args              = "warn"
unreadable_literal                 = "warn"
map_unwrap_or                      = "warn"
unwrap_used                        = "warn"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
